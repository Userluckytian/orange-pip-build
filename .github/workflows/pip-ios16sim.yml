name: PiP iOS16 Simulator Self-Test
#
# 目标（fact #384 交规划者的线索 (b)）：目标明确要求「支持 iOS 16.6.1」，但此前
# #383 的运行期自测因 macos-14 镜像默认不含 iOS 16.x 运行时，实际只跑在
# iPhone @ iOS 18.2 上，目标 OS 版本的等价性从未验证。
#
# 本 workflow 完全在 GitHub Actions 的 macOS runner 内（本机不安装/不运行任何
# Xcode / iOS / 签名工具链）：
#   1) 用 `xcodebuild -downloadPlatform iOS -buildVersion <V>` 为 runner 追加
#      Apple 官方 iOS 16.6 / 16.6.1 / 16.x 模拟器运行时（逐版本、带超时、全量留痕）；
#   2) 创建 iPhone @ iOS 16.x 模拟器设备并启动；
#   3) 重跑 PiP 运行期自测（dlopen 交付源码编译出的 PipEnabler.dylib、
#      pre/post IMP 比对证明 hook 真改写、PipEnablerFeedPixelBuffer 5 帧喂入的
#      重入保护、mirrorLayer.status/error），并对修复前对照复现崩溃；
#   4) 打印模拟器 dylib 的 LC_BUILD_VERSION minos。
# 若运行时下载失败则如实留痕并降级到最接近的可用版本继续自测。
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: pip-ios16sim-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios16sim:
    name: PiP self-test on iOS 16.x simulator runtime
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Show toolchain and available simulator runtimes (before)
        run: |
          set -x
          sw_vers || true
          uname -m
          xcodebuild -version || true
          xcode-select -p || true
          xcrun simctl list runtimes || true

      - name: Probe downloadPlatform capabilities
        continue-on-error: true
        run: |
          set -x
          xcodebuild -help 2>&1 | grep -i -B1 -A6 'downloadPlatform' || true
          echo "==== xcodebuild -downloadPlatform (usage) ===="
          xcodebuild -downloadPlatform 2>&1 | head -60 || true

      - name: Provision iOS 16.6 simulator runtime (best effort)
        id: provision
        continue-on-error: true
        run: |
          mkdir -p simout
          LOG="simout/runtime_provision.log"
          exec > >(tee -a "$LOG") 2>&1
          set -x
          have16 () { xcrun simctl list runtimes | grep -E 'iOS 16\.' || true; }
          for V in 16.6 16.6.1 16.4 16.2 16.1 16.0; do
            if [ -n "$(have16)" ]; then echo "already have an iOS 16 runtime"; break; fi
            echo "===== try: xcodebuild -downloadPlatform iOS -buildVersion $V ====="
            timeout 1800 xcodebuild -downloadPlatform iOS -buildVersion "$V"
            rc=$?
            echo "download rc=$rc (buildVersion=$V)"
            xcrun simctl list runtimes | grep -E 'iOS 16\.' || true
          done
          echo "===== runtimes after provisioning ====="
          xcrun simctl list runtimes || true
          N="$(have16 | wc -l | tr -d ' ')"
          echo "ios16_runtime_lines=$N"
          echo "ios16_runtime_lines=$N" >> "$GITHUB_OUTPUT"

      - name: Build PipEnabler.dylib for iOS Simulator (fixed + unfixed)
        run: |
          set -euxo pipefail
          ARCH="$(uname -m)"
          SIMSDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          echo "ARCH=$ARCH SIMSDK=$SIMSDK"
          mkdir -p simout

          build_dylib () {
            src="$1"; out="$2"
            xcrun --sdk iphonesimulator clang \
              -arch "$ARCH" \
              -mios-simulator-version-min=15.0 \
              -fobjc-arc -dynamiclib \
              -isysroot "$SIMSDK" \
              -install_name @rpath/PipEnabler.dylib \
              -framework Foundation -framework AVFoundation -framework AVKit \
              -framework UIKit -framework CoreMedia -framework CoreVideo \
              "$src" -o "$out"
            file "$out"
            echo "--- LC_BUILD_VERSION / LC_VERSION_MIN_IPHONEOS ($out) ---"
            otool -l "$out" | grep -A5 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_IPHONEOS' || true
          }

          build_dylib build/PipEnabler/PipEnabler.m simout/PipEnabler_fixed.dylib
          cp -f build/simselftest/PipEnabler_pre377.m simout/PipEnabler_unfixed.m
          build_dylib simout/PipEnabler_unfixed.m simout/PipEnabler_unfixed.dylib

          (diff -u simout/PipEnabler_unfixed.m build/PipEnabler/PipEnabler.m > simout/dylib_diff.txt || true)
          echo "===== source diff (unfixed -> fixed) ====="
          cat simout/dylib_diff.txt
          nm -gU simout/PipEnabler_fixed.dylib | grep -i PipEnabler || true

      - name: Build test host binary (iOS Simulator)
        run: |
          set -euxo pipefail
          ARCH="$(uname -m)"
          SIMSDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          xcrun --sdk iphonesimulator clang \
            -arch "$ARCH" \
            -mios-simulator-version-min=15.0 \
            -fobjc-arc \
            -isysroot "$SIMSDK" \
            -framework UIKit -framework Foundation -framework AVFoundation -framework AVKit \
            -framework CoreVideo -framework CoreMedia -framework CoreGraphics \
            build/simselftest/TestHost.m -o simout/TestHost
          file simout/TestHost

      - name: Assemble .app bundles (unfixed / fixed)
        run: |
          set -euxo pipefail
          make_app () {
            appName="$1"; dylib="$2"; bid="$3"
            APP="simout/${appName}.app"
            mkdir -p "$APP"
            cp -f simout/TestHost "${APP}/TestHost"
            cp -f build/simselftest/Info.plist "${APP}/Info.plist"
            cp -f "$dylib" "${APP}/PipEnabler.dylib"
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier ${bid}" "${APP}/Info.plist"
            chmod +x "${APP}/TestHost"
            codesign --force --sign - --timestamp=none "${APP}/PipEnabler.dylib" || true
            codesign --force --sign - --timestamp=none "$APP" || true
            echo "--- $APP ---"; ls -la "$APP"
          }
          make_app TestHostUnfixed simout/PipEnabler_unfixed.dylib com.artex.pipselftest.unfixed
          make_app TestHostFixed   simout/PipEnabler_fixed.dylib   com.artex.pipselftest.fixed

      - name: Pick / create iOS 16.x simulator device and boot it
        id: sim
        run: |
          set -euxo pipefail
          python3 - <<'PY' > simout/pick_runtime.txt
          import json, subprocess
          d = json.loads(subprocess.check_output(["xcrun","simctl","list","-j"]).decode())
          def key(r):
              p = [int(x) for x in r["version"].split(".")]
              while len(p) < 3: p.append(0)
              return p
          rts = [r for r in d["runtimes"] if r.get("isAvailable") and r["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS")]
          rts.sort(key=key)
          ios16 = [r for r in rts if r["version"].startswith("16")]
          pick = (ios16 or rts)[-1] if (ios16 or rts) else None
          print(pick["identifier"] if pick else "")
          PY
          RUNTIME_ID="$(cat simout/pick_runtime.txt)"
          echo "RUNTIME_ID=$RUNTIME_ID"
          echo "runtime_id=$RUNTIME_ID" >> "$GITHUB_OUTPUT"
          test -n "$RUNTIME_ID" || { echo "ERROR: no iOS simulator runtime available"; exit 1; }

          DEVTYPE="com.apple.CoreSimulator.SimDeviceType.iPhone-14"
          if ! xcrun simctl list devicetypes | grep -q "SimDeviceType.iPhone-14"; then
            DEVTYPE="$(xcrun simctl list devicetypes | grep -oE 'com\.apple\.CoreSimulator\.SimDeviceType\.iPhone-1[0-9]' | tail -1)"
          fi
          echo "DEVTYPE=$DEVTYPE"

          UDID="$(xcrun simctl create pipselftest "$DEVTYPE" "$RUNTIME_ID")"
          echo "UDID=$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl list devices | grep "$UDID" || true

      - name: Run UNFIXED dylib (expect runtime crash) then FIXED dylib
        run: |
          set -uo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          echo "TARGET RUNTIME = ${{ steps.sim.outputs.runtime_id }}"
          run_one () {
            tag="$1"; bundleid="$2"; appdir="$3"
            echo "==================== RUN $tag ===================="
            xcrun simctl uninstall "$UDID" "$bundleid" >/dev/null 2>&1 || true
            xcrun simctl install "$UDID" "$appdir"
            ( xcrun simctl launch --console-pty --terminate-running-process "$UDID" "$bundleid" > "simout/console_${tag}.txt" 2>&1 ) &
            pid=$!
            for i in $(seq 1 90); do
              kill -0 "$pid" 2>/dev/null || break
              sleep 2
            done
            if kill -0 "$pid" 2>/dev/null; then echo "WATCHDOG: killing hung launch"; kill -9 "$pid" 2>/dev/null; fi
            wait "$pid" 2>/dev/null; rc=$?
            echo "launch rc=$rc (tag=$tag)"
            echo "--- console_${tag}.txt (tail) ---"
            tail -60 "simout/console_${tag}.txt" || true
            CONT="$(xcrun simctl get_app_container "$UDID" "$bundleid" data 2>/dev/null || true)"
            echo "container=$CONT"
            if [ -n "$CONT" ] && [ -f "$CONT/Documents/pip_selftest_report.txt" ]; then
              cp "$CONT/Documents/pip_selftest_report.txt" "simout/report_${tag}.txt"
              echo "===== REPORT $tag ====="
              cat "simout/report_${tag}.txt"
            else
              echo "NO REPORT for $tag (进程可能已崩溃/未写出)"
            fi
            echo ""
          }
          run_one unfixed com.artex.pipselftest.unfixed simout/TestHostUnfixed.app
          echo "--- newest host-side crash reports (if any) ---"
          ls -t ~/Library/Logs/DiagnosticReports 2>/dev/null | head -10 || true
          mkdir -p simout/crashreports || true
          cp $(ls -t ~/Library/Logs/DiagnosticReports/TestHost* 2>/dev/null | head -4) simout/crashreports/ 2>/dev/null || true

          run_one fixed com.artex.pipselftest.fixed simout/TestHostFixed.app

      - name: Verify fixed report on iOS 16.x
        run: |
          set -euxo pipefail
          echo "===== TARGET RUNTIME = ${{ steps.sim.outputs.runtime_id }} ====="
          echo "===== dylib_diff.txt ====="
          cat simout/dylib_diff.txt || true
          echo "===== report_fixed.txt ====="
          cat simout/report_fixed.txt || { echo "ERROR: fixed run produced no report"; exit 1; }
          grep -q "SELFTEST_RESULT: PASS" simout/report_fixed.txt || { echo "ERROR: SELFTEST_RESULT not PASS"; exit 1; }
          echo "OK: fixed dylib runtime self-test PASS on ${{ steps.sim.outputs.runtime_id }}"

      - name: Upload self-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-ios16-selftest
          path: simout/**
          if-no-files-found: warn
          retention-days: 30
