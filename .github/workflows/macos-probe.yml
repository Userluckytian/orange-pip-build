name: macos-probe
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  mac:
    runs-on: macos-14
    steps:
      - name: env
        run: |
          echo "=== sw_vers ==="; sw_vers
          echo "=== xcodebuild ==="; xcodebuild -version || true
          echo "=== python3 ==="; python3 --version || true
          echo "=== which ldid/ldid2 ==="; which ldid || true
          echo "=== codesign ==="; which codesign || true
          echo "=== zip ==="; which zip || true
